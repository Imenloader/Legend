<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <title>Legends of the Jade and Sand | Hybrid RPG</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Ma+Shan+Zheng&display=swap"
        rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        html,
        body {
            touch-action: manipulation;
        }

        .ornament {
            pointer-events: none;
        }

        button {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

    </style>

</head>

<body>

<div id="game-container">

    <!-- MAIN MENU -->
    <div id="menu-screen" class="screen active">

        <div class="ornament top"></div>

        <h1>Jade & Sand<br>Legends</h1>

        <input
            type="text"
            id="char-name"
            placeholder="Enter your Legend's Name..."
            autocomplete="off"
            style="margin-bottom: 20px;"
        />

        <select
            id="perspective-select"
            style="
                width:100%;
                padding:16px;
                background:rgba(0,0,0,0.5);
                border:1px solid var(--glass-border);
                border-radius:4px;
                color:var(--text);
                font-size:1.1rem;
                margin-bottom:30px;
                font-family:'Inter', sans-serif;
            "
        >
            <option value="second">
                Second Person ("You walk...")
            </option>

            <option value="first">
                First Person ("I walk...")
            </option>
        </select>

        <button
            id="start-btn"
            class="btn"
            type="button"
        >
            Begin Journey
        </button>

        <div class="ornament bottom"></div>

    </div>

    <!-- CHARACTER CREATION -->
    <div id="creation-screen" class="screen">

        <h1>Select Destiny</h1>

        <div class="input-group">
            <input
                type="text"
                id="player-name"
                placeholder="Enter Hero Name"
                maxlength="12"
            />
        </div>

        <div class="class-selector">

            <div
                class="class-card selected"
                data-class="Sword Immortal"
                data-sprite="assets/sword_immortal_1778872325571.png"
            >
                <div class="card-image-wrapper">
                    <img
                        class="card-bg"
                        src="assets/sword_immortal_1778872325571.png"
                        alt="Sword Immortal"
                    />
                </div>

                <h3>Sword Immortal</h3>
                <p>High Crit & Damage</p>

            </div>

            <div
                class="class-card"
                data-class="Medicine Cultivator"
                data-sprite="assets/medicine_cultivator_1778872338789.png"
            >
                <div class="card-image-wrapper">
                    <img
                        class="card-bg"
                        src="assets/medicine_cultivator_1778872338789.png"
                        alt="Medicine Cultivator"
                    />
                </div>

                <h3>Medicine Cultivator</h3>
                <p>High HP & Healing</p>

            </div>

            <div
                class="class-card"
                data-class="Desert Knight"
                data-sprite="assets/desert_knight_1778872351281.png"
            >
                <div class="card-image-wrapper">
                    <img
                        class="card-bg"
                        src="assets/desert_knight_1778872351281.png"
                        alt="Desert Knight"
                    />
                </div>

                <h3>Desert Knight</h3>
                <p>High Defense & HP</p>

            </div>

            <div
                class="class-card"
                data-class="Sufi Mystic"
                data-sprite="assets/sufi_mystic_1778872363338.png"
            >
                <div class="card-image-wrapper">
                    <img
                        class="card-bg"
                        src="assets/sufi_mystic_1778872363338.png"
                        alt="Sufi Mystic"
                    />
                </div>

                <h3>Sufi Mystic</h3>
                <p>High Qi & Magic</p>

            </div>

        </div>

        <button id="create-btn" class="btn">
            Awaken Soul
        </button>

    </div>

    <!-- HUB CITY -->
    <div id="hub-screen" class="screen">

        <h1 style="font-size:3rem;">
            City of Crossroads
        </h1>

        <p>
            The Silk Road bustles with merchants, cultivators, and mystics.
        </p>

        <div
            class="class-selector"
            style="grid-template-columns:1fr 1fr 1fr;gap:20px;"
        >

            <button
                id="explore-btn"
                class="btn"
                style="width:100%;"
            >
                Venture Forth
            </button>

            <button
                id="inventory-btn"
                class="btn btn-secondary"
                style="width:100%;"
            >
                Inventory
            </button>

            <button
                id="rest-btn"
                class="btn btn-secondary"
                style="width:100%;"
            >
                Meditation
            </button>

        </div>

    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="screen">

        <h1 id="result-title">
            Ascension
        </h1>

        <p id="result-text">
            The path continues.
        </p>

        <div
            class="actions"
            style="
                margin-top:20px;
                display:flex;
                flex-direction:column;
                gap:15px;
                width:100%;
                max-width:400px;
                margin-left:auto;
                margin-right:auto;
            "
        >

            <!-- CHANGED IDS -->
            <button
                id="result-explore-btn"
                class="btn"
            >
                Continue Journey
            </button>

            <button
                id="result-inventory-btn"
                class="btn btn-secondary"
            >
                Equipment & Artifacts
            </button>

            <button
                id="result-rest-btn"
                class="btn btn-secondary"
            >
                Meditate (Restore All)
            </button>

        </div>

    </div>

</div>

<!-- GAME FILES -->
<script src="/audio.js"></script>
<script src="/lore.js"></script>
<script src="/lore_part2.js"></script>
<script src="/companions.js"></script>
<script src="/story.js"></script>
<script src="/combat.js"></script>
<script src="/game.js"></script>

<!-- MOBILE TOUCH FIX -->
<script>

document.addEventListener("DOMContentLoaded", () => {

    const startBtn = document.getElementById("start-btn");

    if (!startBtn) return;

    let touched = false;

    startBtn.addEventListener(
        "touchstart",
        function(e) {

            touched = true;

            e.preventDefault();

            startBtn.click();

        },
        { passive: false }
    );

    startBtn.addEventListener(
        "click",
        function(e) {

            if (touched) {
                touched = false;
            }

        }
    );

});

</script>

</body>
</html>
